{% extends "base.html" %}
{% block title %}Redefinir senha{% endblock %}
{% block content %}
<h1>Redefinir senha de {{ conta.username }}</h1>
<form method="post" class="formulario-estreito">
  {% csrf_token %}
  {{ form }}
  <div class="acoes">
    <button type="submit">Definir senha</button>
    <a href="{% url 'contas:lista_contas' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
