{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<h1>Alterar minha senha</h1>
<form method="post" class="formulario-estreito">
  {% csrf_token %}
  {{ form }}
  <div class="acoes">
    <button type="submit">Salvar nova senha</button>
    <a href="{% url 'nucleo:inicio' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
